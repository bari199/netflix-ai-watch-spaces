name: netflix-ai-watch-spaces

services:
  mongodb:
    image: mongo:8.0
    container_name: netflix-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - netflix_mongodb_data:/data/db

  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: netflix-ai-video
    restart: unless-stopped
    command: server /data --license /minio.license --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${NETFLIX_MINIO_ROOT_USER:?NETFLIX_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${NETFLIX_MINIO_ROOT_PASSWORD:?NETFLIX_MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    volumes:
      - netflix_minio_data:/data
      - "C:/MinIO/minio.license:/minio.license:ro"

volumes:
  netflix_mongodb_data:
    name: netflix_mongodb_data

  netflix_minio_data:
    name: netflix_minio_data
